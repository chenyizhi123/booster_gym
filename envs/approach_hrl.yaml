# HRL版本的approach配置文件
env:
  num_envs: 4096
  num_observations: 14  # 高层策略观察维度 (3+3+3+1+1+3=14维)
  num_privileged_obs: 20  # 14+3+3=20维
  num_actions: 3       # 高层策略动作维度 [ΔVx, ΔVy, ΔW_ang]
  env_spacing: 15.0

# HRL特定配置
hrl:
  enabled: true
  decision_interval: 10  # 高层策略决策间隔（帧）- 50Hz/5Hz = 10帧
  
  # t1模型配置
  t1_model:
    checkpoint_path: "-1"  # 设置为-1自动寻找最新模型，或指定具体路径
    

  
  action_space:
    command_limits: [1.5, 1.0, 1.0]     # [Vx, Vy, W_ang] 绝对速度限制
    delta_limits: [0.2, 0.1, 0.1]      # [ΔVx, ΔVy, ΔW_ang] 增量限制
  

  
  curriculum:
    enabled: true
    success_threshold: 0.75
    window_size: 100
    levels:
      0:  # 入门级
        ball_distance_range: [0.3, 0.8]
        ball_angle_range: [-0.2, 0.2]
        episode_length: 300
      1:  # 进阶级
        ball_distance_range: [0.8, 2.5]
        ball_angle_range: [-1.0, 1.0]
        episode_length: 500
      2:  # 高级
        ball_distance_range: [2.5, 5.0]
        ball_angle_range: [-3.14, 3.14]
        episode_length: 800

# 继承原有配置结构
asset:
  file: "urdf/anymal_c/urdf/anymal_c.urdf"
  name: "anymal_c"
  base_name: "base"
  foot_names: ["LF_FOOT", "RF_FOOT", "LH_FOOT", "RH_FOOT"]
  default_dof_drive_mode: 1
  collapse_fixed_joints: true
  replace_cylinder_with_capsule: true
  flip_visual_attachments: false
  fix_base_link: false
  density: 0.001
  angular_damping: 0.0
  linear_damping: 0.0
  max_angular_velocity: 1000.0
  max_linear_velocity: 1000.0
  armature: 0.0
  thickness: 0.01
  disable_gravity: false
  self_collisions: 0

init_state:
  pos: [0.0, 0.0, 0.42]
  rot: [0.0, 0.0, 0.0, 1.0]
  lin_vel: [0.0, 0.0, 0.0]
  ang_vel: [0.0, 0.0, 0.0]
  default_joint_angles:
    LF_HAA: 0.0
    LH_HAA: 0.0
    RF_HAA: 0.0
    RH_HAA: 0.0
    LF_HFE: 0.4
    LH_HFE: -0.4
    RF_HFE: 0.4
    RH_HFE: -0.4
    LF_KFE: -0.8
    LH_KFE: 0.8
    RF_KFE: -0.8
    RH_KFE: 0.8
    default: 0.0

control:
  action_scale: 0.5
  decimation: 4
  stiffness:
    HAA: 80.0
    HFE: 80.0
    KFE: 80.0
  damping:
    HAA: 2.0
    HFE: 2.0
    KFE: 2.0

terrain:
  type: "plane"

commands:
  num_commands: 4
  curriculum: false
  lin_vel_x: [-1.0, 1.0]
  lin_vel_y: [-1.0, 1.0]
  ang_vel_yaw: [-1.0, 1.0]
  gait_frequency: [2.0, 4.0]

rewards:
  scales:
    # VLN风格HRL奖励
    approach: 1.0                   # 阶段1: 接近球
    alignment: 2.0                  # 阶段2: 对齐球门
    dribble: 1.5                    # 阶段3: 带球前进
    shoot: 3.0                      # 阶段4: 加速射门
    delta_quality: 0.5              # 速度增量合理性
    # 安全性奖励
    orientation: -0.2               # 防止翻倒
    base_height: -0.5              # 保持合适高度
    collision: -1.0                # 避免碰撞
    dof_pos_limits: -10.0          # 关节限位保护
  
  # 奖励设置
  only_positive_rewards: false
    
  # HRL成功条件
  success_distance_threshold: 0.5
  success_angle_threshold: 30.0
  base_height_target: 0.42
  episode_length_s: 20.0
  terminate_height: 0.24
  terminate_vel: 50.0
  soft_dof_pos_limit: 0.9
  
  # 接触相关配置
  penalize_contacts_on: ["SHANK", "THIGH"]
  terminate_contacts_on: ["base"]

normalization:
  clip_actions: 1.0
  gravity: 1.0
  ang_vel: 1.0
  lin_vel: 1.0
  dof_pos: 1.0
  dof_vel: 0.1
  filter_weight: 0.1

sim:
  dt: 0.005
  substeps: 1
  gravity: [0.0, 0.0, -9.81]
  up_axis: 1
  use_gpu_pipeline: true

# 随机化配置
randomization:
  kick_interval_s: 10.0
  kick_lin_vel: 0.0
  kick_ang_vel: 0.0
  push_interval_s: 15.0
  push_duration_s: 0.5
  push_force: 0.0
  push_torque: 0.0
  
  # 初始化随机化
  init_dof_pos: 0.0
  init_base_pos_xy: 0.0
  
  # 物理属性随机化
  base_com: 0.0
  base_mass: 0.0
  other_com: 0.0
  other_mass: 0.0
  dof_stiffness: 0.0
  dof_damping: 0.0
  dof_friction: 0.0
  friction: 0.0
  compliance: 0.0
  restitution: 0.0

# 噪声配置
noise:
  gravity:
    range: [0., 0.01]
    operation: "additive"
    distribution: "gaussian"
  lin_vel:
    range: [0., 0.05]
    operation: "additive"
    distribution: "gaussian"
  ang_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  dof_pos:
    range: [0., 0.01]
    operation: "additive"
    distribution: "gaussian"
  dof_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  height:
    range: [0., 0.02]
    operation: "additive"
    distribution: "gaussian"
    
randomization:
  init_dof_pos:
    range: [0., 0.05]
    operation: "additive"
    distribution: "gaussian"
  init_base_pos_xy:
    range: [-1., 1.]
    operation: "additive"
    distribution: "uniform"
  init_base_lin_vel_xy:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"

  kick_interval_s: 1.
  kick_lin_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  kick_ang_vel:
    range: [0., 0.02]
    operation: "additive"
    distribution: "gaussian"

  push_interval_s: 2.
  push_duration_s: 1.
  push_force:
    range: [0., 10.]
    operation: "additive"
    distribution: "gaussian"
  push_torque:
    range: [0., 2.]
    operation: "additive"
    distribution: "gaussian"

  dof_stiffness:
    range: [0.95, 1.05]
    operation: "scaling"
    distribution: "uniform"
  dof_damping:
    range: [0.95, 1.05]
    operation: "scaling"
    distribution: "uniform"
  dof_friction:
    range: [0.0, 2.0]
    operation: "additive"
    distribution: "uniform"

  friction:
    range: [0.1, 2.0]
    operation: "additive"
    distribution: "uniform"
  compliance:
    range: [0.5, 1.5]
    operation: "additive"
    distribution: "uniform"
  restitution:
    range: [0.1, 0.9]
    operation: "additive"
    distribution: "uniform"

  base_com:
    range: [-0.1, 0.1]
    operation: "additive"
    distribution: "uniform"
  base_mass:
    range: [0.8, 1.2]
    operation: "scaling"
    distribution: "uniform"
  other_com:
    range: [-0.005, 0.005]
    operation: "additive"
    distribution: "uniform"
  other_mass:
    range: [0.98, 1.02]
    operation: "scaling"
    distribution: "uniform"